<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Route Optimisation - Smart Waste Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f7f7f7 0%, #d6bbf0 50%, #301035 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      min-height: 100vh;
      color: #1a1a1a;
      overflow-x: hidden;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .dashboard {
      display: grid;
      grid-template-columns: 280px 1fr;
      grid-template-rows: 80px 1fr;
      grid-template-areas: 
        "sidebar header"
        "sidebar main";
      min-height: 100vh;
      position: relative;
      z-index: 2;
    }
    .sidebar {
      grid-area: sidebar;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-right: 1px solid rgba(255,255,255,0.2);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: relative;
      overflow-y: auto;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1a1a1a;
      text-decoration: none;
      position: relative;
      z-index: 1;
    }
    .logo-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: white;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }
    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
      z-index: 1;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-radius: 15px;
      color: #6b7280;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .nav-item.active, .nav-item:hover {
      background: rgba(255,255,255,0.2);
      color: #1a1a1a;
      transform: translateX(10px);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .nav-item i {
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }
    .header {
      grid-area: header;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }
    .page-title {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      position: relative;
      z-index: 1;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .main {
      grid-area: main;
      padding: 2rem;
      overflow-y: auto;
      position: relative;
    }
    .route-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }
    .route-tools input[type="text"] {
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      font-size: 1rem;
      outline: none;
      min-width: 180px;
    }
    .route-tools button {
      padding: 0.7rem 1.2rem;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .route-tools button:hover {
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }
    .map-container {
      width: 100%;
      height: 500px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      margin-bottom: 2rem;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .status-card {
      margin-top: 1rem;
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      max-width: 400px;
    }
    .status-card h3 {
      margin-bottom: 0.5rem;
      color: #764ba2;
    }
    .status-card span {
      font-weight: 600;
    }
    @media (max-width: 1024px) {
      .dashboard {
        grid-template-columns: 1fr;
        grid-template-areas: 
          "header"
          "main";
      }
      .sidebar {
        display: none;
      }
    }
    @media (max-width: 768px) {
      .main {
        padding: 1rem;
      }
      .map-container {
        height: 300px;
      }
    }
  </style>
  <link rel="stylesheet" href="style1.css"/>
</head>
<body>
  <div class="dashboard">
    <!-- Sidebar -->
    <aside class="sidebar">
      <a href="index1.html" class="logo">
        <div class="logo-icon"><i class="fas fa-recycle"></i></div>
        <span>Smart Waste</span>
      </a>
      <nav class="nav-menu">
        <a href="index1.html" class="nav-item"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
        <a href="route.html" class="nav-item active"><i class="fas fa-route"></i><span>Route Optimisation</span></a>
        <a href="fleetmanagement.html" class="nav-item"><i class="fas fa-truck"></i><span>Fleet Management</span></a>
        <a href="#" class="nav-item"><i class="fas fa-dumpster"></i><span>Bin Monitoring</span></a>
        <a href="#" class="nav-item"><i class="fas fa-bell"></i><span>Alerts</span></a>
        <a href="#" class="nav-item"><i class="fas fa-chart-line"></i><span>Analytics</span></a>
        <a href="#" class="nav-item"><i class="fas fa-brain"></i><span>AI Predictions</span></a>
        <a href="protect_environment_game.html" class="nav-item"><i class="fas fa-trophy"></i><span>Gamification</span></a>
        <a href="awarness.html" class="nav-item"><i class="fas fa-lightbulb"></i><span>Awareness</span></a>
        <a href="#" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
      </nav>
    </aside>

    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <h1 class="page-title"><i class="fas fa-route"></i> Route Optimisation</h1>
      </div>
      <div class="header-actions">
        <button class="btn btn-secondary" id="themeToggle"><i class="fas fa-moon"></i></button>
        <div class="notification-badge">
          <i class="fas fa-bell"></i><span class="badge-count" id="notificationCount">3</span>
        </div>
        <button class="btn btn-primary" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <div class="route-tools">
        <button id="normalMapBtn">Normal Map</button>
        <button id="satelliteMapBtn">Satellite Map</button>
        <input type="text" id="binSearch" placeholder="Enter Bin No. (e.g. 1, 2, 3)" />
        <button id="binSearchBtn"><i class="fas fa-search"></i> Track Bin</button>
        <input type="text" id="truckSearch" placeholder="Enter Truck No. (e.g. 103, 205, 118)" />
        <button id="truckSearchBtn"><i class="fas fa-search"></i> Track Truck</button>
      </div>
      <div class="map-container">
        <div id="map"></div>
      </div>
      <div id="statusCard" class="status-card" style="display:none;"></div>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Map setup
    let map = L.map('map').setView([30.3165, 78.0322], 13);

    // Tile layers
    const normalLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri'
    });

    // Switch map type
    document.getElementById('normalMapBtn').onclick = function() {
      map.removeLayer(satelliteLayer);
      map.addLayer(normalLayer);
    };
    document.getElementById('satelliteMapBtn').onclick = function() {
      map.removeLayer(normalLayer);
      map.addLayer(satelliteLayer);
    };

    // Demo bin and truck data
    const bins = [
      { id: 1, coords: [30.324, 78.045], fill: 95, location: "Prem Nagar" },
      { id: 2, coords: [30.309, 78.05], fill: 65, location: "Suddhuwala" },
      { id: 3, coords: [30.306, 78.02], fill: 30, location: "Nanda Ki Chowki" }
    ];
    const trucks = [
      { id: 103, coords: [30.3165, 78.0322], status: "On Route" },
      { id: 205, coords: [30.312, 78.038], status: "Maintenance" },
      { id: 118, coords: [30.320, 78.028], status: "Depot" }
    ];

    // Add bin markers
    const binMarkers = {};
    bins.forEach(bin => {
      const icon = L.divIcon({
        html: '<i class="fas fa-dumpster" style="color:#f093fb;font-size:20px;"></i>',
        className: 'bin-marker',
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
      binMarkers[bin.id] = L.marker(bin.coords, { icon }).addTo(map)
        .bindPopup(`<b>Bin #${bin.id}</b><br>Location: ${bin.location}<br>Fill: ${bin.fill}%`);
    });

    // Add truck markers
    const truckMarkers = {};
    trucks.forEach(truck => {
      const icon = L.divIcon({
        html: '<i class="fas fa-truck" style="color:#667eea;font-size:20px;"></i>',
        className: 'truck-marker',
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
      truckMarkers[truck.id] = L.marker(truck.coords, { icon }).addTo(map)
        .bindPopup(`<b>Truck #${truck.id}</b><br>Status: ${truck.status}`);
    });

    // Bin search
    document.getElementById('binSearchBtn').onclick = function() {
      const binNo = parseInt(document.getElementById('binSearch').value.trim());
      const bin = bins.find(b => b.id === binNo);
      const statusCard = document.getElementById('statusCard');
      if (bin) {
        map.setView(bin.coords, 15);
        binMarkers[bin.id].openPopup();
        statusCard.innerHTML = `<h3>Bin #${bin.id} - ${bin.location}</h3>
          <span>Fill Level:</span> ${bin.fill}%<br>
          <span>Status:</span> ${bin.fill >= 80 ? '<span style="color:red;">Critical</span>' : (bin.fill >= 50 ? '<span style="color:orange;">Warning</span>' : '<span style="color:green;">Normal</span>')}
        `;
        statusCard.style.display = '';
      } else {
        statusCard.innerHTML = `<h3>Bin Not Found</h3>`;
        statusCard.style.display = '';
      }
    };

    // Truck search
    document.getElementById('truckSearchBtn').onclick = function() {
      const truckNo = parseInt(document.getElementById('truckSearch').value.trim());
      const truck = trucks.find(t => t.id === truckNo);
      const statusCard = document.getElementById('statusCard');
      if (truck) {
        map.setView(truck.coords, 15);
        truckMarkers[truck.id].openPopup();
        statusCard.innerHTML = `<h3>Truck #${truck.id}</h3>
          <span>Status:</span> ${truck.status}
        `;
        statusCard.style.display = '';
      } else {
        statusCard.innerHTML = `<h3>Truck Not Found</h3>`;
        statusCard.style.display = '';
      }
    };

    // Theme toggle (optional)
    document.getElementById('themeToggle').onclick = function() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      this.querySelector('i').className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
    };

    // Logout
    document.getElementById('logoutBtn').onclick = function() {
      if (confirm('Are you sure you want to logout?')) {
        window.location.href = 'index.html';
      }
    };
  </script>
</body>
</html>
