<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Waste Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card-3d">
    <div class="card-inner">
      <div class="logo">
        <span>♻</span> Smart Waste Management System
      </div>
      <div class="subtitle">Enter your waste management portal</div>
      <div class="input-box user">
        <input type="text" id="username" placeholder="Enter your username">
      </div>
      <div class="input-box pass">
        <input type="password" id="password" placeholder="Enter your password">
      </div>
      <button class="btn login-btn" onclick="login()">➜ Login</button>
      <div id="login-feedback" style="margin-top:10px;font-size:14px;opacity:.9;"></div>
      <button class="forgot-btn" onclick="window.location.href='forgotpass.html'">Forgot Password?</button>
          <div class="footer">
        ℹ️ New here? <a href="signup.html" class="signup-link">Sign up for an account</a>
      </div>
      <button class="dark-toggle" onclick="toggleDarkMode()">🌙 </button>
      <div id="accountSection" class="account-section">
        <p id="accountUser"></p>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
